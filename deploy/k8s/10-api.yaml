apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aifabric
  labels: { app: aifabric-api }
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: aifabric-api }
  template:
    metadata:
      labels: { app: aifabric-api }
    spec:
      serviceAccountName: aifabric-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: aifabric-api }
      containers:
        - name: api
          image: ghcr.io/iamhasaanzahid/project51-api:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          envFrom:
            - secretRef: { name: aifabric-api-secrets }
            - configMapRef: { name: aifabric-config }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: tls, mountPath: /etc/aifabric/tls, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: tls
          secret: { secretName: aifabric-tls-ca, optional: false }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aifabric
spec:
  type: ClusterIP
  selector: { app: aifabric-api }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: aifabric
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: aifabric-api }
