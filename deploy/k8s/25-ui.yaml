apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: aifabric
  labels: { app: aifabric-ui }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: aifabric-ui }
  template:
    metadata:
      labels: { app: aifabric-ui }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ui
          image: ghcr.io/iamhasaanzahid/project51-ui:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8501 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          env:
            # Server-side calls stay inside the cluster; the browser never talks
            # to this URL (images/results use presigned HTTPS URLs).
            - { name: API_BASE_URL, value: "http://api:8000" }
            - { name: DEMO_MODE, value: "false" }
            - { name: HOME, value: "/tmp" }
            - { name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION, value: "true" }
            - { name: STREAMLIT_SERVER_ENABLE_CORS, value: "false" }
            - { name: STREAMLIT_BROWSER_GATHER_USAGE_STATS, value: "false" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /_stcore/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: aifabric
spec:
  type: ClusterIP
  selector: { app: aifabric-ui }
  ports:
    - { name: http, port: 8501, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ui
  namespace: aifabric
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: aifabric-ui }
