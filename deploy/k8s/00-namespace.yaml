apiVersion: v1
kind: Namespace
metadata:
  name: aifabric
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aifabric-api
  namespace: aifabric
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aifabric-worker
  namespace: aifabric
automountServiceAccountToken: false
