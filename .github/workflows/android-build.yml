name: Build MeshLink APK

on:
  push:
    branches: [ main ]
    paths: [ "meshlink_android/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshlink_android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PmeshlinkApiUrl="${{ vars.MESHLINK_API_URL || 'https://meshlink-api.onrender.com' }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshlink-debug-apk
          path: meshlink_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
