name: DevSecOps

# Gate policy
# -----------
# Blocking: unit tests, container build. These say "the software is broken".
# Advisory: SAST, dependency audit, image CVEs, IaC drift. These say "a scanner
# found something" and are published to the Security tab as SARIF instead of
# failing the run. Blocking scanners that emit findings on every base-image
# refresh turns CI into noise, and a red badge nobody reads is worse than an
# advisory list somebody triages weekly.
#
# Secrets are read through job-level `env`, never through `secrets` in an
# `if:` expression — the `secrets` context is not available to step conditions
# and made this workflow invalid.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly drift / dependency scan

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SECRET_KEY: "ci-only-not-a-real-secret-0000000000000000"

jobs:
  # ------------------------------------------------------------------ tests
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest -q -m "not integration" --cov=app --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # ------------------------------------------------------------ integration
  integration:
    name: Integration (PostgreSQL + fakeredis)
    runs-on: ubuntu-latest
    # Container-backed tests depend on the runner's Docker daemon. They are
    # useful signal but not a reason to block a merge when the daemon is slow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Integration tests (testcontainers)
        run: pytest -q -m integration

  # -------------------------------------------------------------------- sast
  sast:
    name: SAST + secrets
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit[toml]==1.7.9 semgrep==1.79.0
      - name: Bandit
        run: bandit -r app -c pyproject.toml -ll -ii || true
      - name: Semgrep
        run: semgrep --config security/semgrep.yml --sarif --output semgrep.sarif app
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with: { sarif_file: semgrep.sarif }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/.gitleaks.toml

  # ---------------------------------------------------------- dependencies
  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.7.3
      - name: pip-audit (API/worker runtime)
        run: pip-audit -r requirements-api.txt --strict --desc || true
      - name: pip-audit (UI runtime)
        run: pip-audit -r requirements.txt --strict --desc || true
      - name: Trivy filesystem (vuln + secret + config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with: { sarif_file: trivy-fs.sarif }
      - name: Snyk (optional)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ------------------------------------------------------------- containers
  containers:
    name: Container scan
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t aifabric-api:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aifabric-api:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        with: { sarif_file: trivy-image.sarif }
      - name: Docker Scout
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/scout-action@v1
        env:
          DOCKER_HUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ env.DOCKERHUB_PASSWORD }}
        with:
          command: cves
          image: aifabric-api:ci
          only-severities: critical,high
          exit-code: false
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: aifabric-api:ci
          format: spdx-json
          output-file: sbom-api.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-api.spdx.json

  # ------------------------------------------------------------------- iac
  iac:
    name: IaC + CIS benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Trivy config (Docker/K8s)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-config.sarif') != ''
        with: { sarif_file: trivy-config.sarif }
      - name: kube-score
        run: |
          curl -sSLo kube-score https://github.com/zegl/kube-score/releases/download/v1.18.0/kube-score_1.18.0_linux_amd64
          chmod +x kube-score
          ./kube-score score deploy/k8s/*.yaml --output-format ci || true
      - name: Docker Bench Security (report only)
        run: |
          docker run --rm --net host --pid host --userns host --cap-add audit_control \
            -e DOCKER_CONTENT_TRUST=$DOCKER_CONTENT_TRUST \
            -v /var/lib:/var/lib:ro -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v /etc:/etc:ro --label docker_bench_security \
            docker/docker-bench-security > docker-bench.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: docker-bench
          path: docker-bench.txt
