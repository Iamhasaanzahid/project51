global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aifabric-prod

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: aifabric-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: aifabric-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
