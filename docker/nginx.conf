# ---------------------------------------------------------------------------
# Edge reverse proxy - TLS 1.3 only, HSTS, request-rate shaping, body cap.
# ---------------------------------------------------------------------------
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format json_combined escape=json
      '{"ts":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
      '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
      '"ua":"$http_user_agent","request_id":"$http_x_request_id"}';
    access_log /dev/stdout json_combined;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    client_max_body_size 16m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    limit_req_status 429;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_dhparam /etc/nginx/tls/dhparam.pem;
    ssl_stapling on;
    ssl_stapling_verify on;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header Server;

        location /api/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://api_backend;
        }

        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            proxy_read_timeout 120s;
            proxy_pass http://api_backend;
        }

        location /healthz { proxy_pass http://api_backend; }
        location /readyz  { proxy_pass http://api_backend; }
        location /metrics { deny all; }
    }
}
