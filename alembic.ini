[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Overridden by migrations/env.py from POSTGRES_* / ALEMBIC_DATABASE_URL.
sqlalchemy.url = postgresql+asyncpg://aifabric_app:password@localhost:5432/aifabric_prod

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
